[package]
name = "morning-commander"
version = "0.1.0"
description = "Dual-pane file manager for macOS"
authors = ["Werner Moraes <wernerpm@gmail.com>"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "morning_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
trash = "5.2.9"
parking_lot = "0.12.5"
rayon = "1.12.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
log = "0.4.34"
env_logger = "0.11.11"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
